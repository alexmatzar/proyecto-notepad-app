<app-top-nav (hamburgerClick)="onHamburgerClick()" />

<main class="flex-1 flex overflow-hidden bg-[#f8f9fa]" data-purpose="main-content">

  <app-sidebar
    [activeView]="activeView()"
    [isPinned]="sidebarPinned()"
    (viewChange)="onViewChange($event)" />

  @if (activeView() === 'notes') {
    <app-editor-notas />
  }

</main>
