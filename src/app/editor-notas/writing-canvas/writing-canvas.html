<div class="canvas-wrapper" data-purpose="writing-canvas">

  <div class="editor-container">
    
    <div
      #editor
      class="editable-area"
      contenteditable="true"
      (input)="onInput($event)">
    </div>

    <div class="empty-state" [style.display]="isEmpty ? 'block' : 'none'" (click)="focusEditor()">
      <div class="hint-text">Start writing, press '/' for commands...</div>
      
      <button class="help-write-btn" (click)="$event.stopPropagation()">
        <i class="fa-solid fa-wand-magic-sparkles magic-icon"></i>
        Help me write
      </button>
    </div>

  </div>

</div>

<div class="bottom-actions-right" data-purpose="bottom-right-actions">
  <button class="action-btn"><i class="fa-regular fa-copy"></i></button>
  <button class="action-btn"><i class="fa-solid fa-download"></i></button>
  <button class="action-btn delete-btn"><i class="fa-regular fa-trash-can"></i></button>
</div>

<div class="bottom-actions-left" data-purpose="bottom-left-actions">
  
  @if (isEmpty) {
    <button class="upload-btn">
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Upload Doc
    </button>
  } @else {
    <span class="text-xs font-semibold text-gray-500" style="padding-left: 8px;">
      Words: {{ wordCount }} Characters: {{ charCount }}
    </span>
  }

</div>
