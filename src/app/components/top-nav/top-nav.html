<header class="top-nav-header" data-purpose="top-navigation">
  <div class="left-section">
    <button class="hamburger-btn" (click)="onHamburger()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="brand">
      <svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L22 12L12 22L2 12L12 2Z" fill="#0ea5e9"></path>
        <path d="M12 2L2 12L12 22V2Z" fill="#0284c7"></path>
      </svg>
      <div class="brand-text">
        <div>Online</div>
        <div>Notepad</div>
      </div>
    </div>

    <div class="doc-title-wrapper">
      <input
        class="doc-title-input"
        placeholder="Untitled Document"
        type="text"
        [value]="noteService.getActiveNote()?.titulo === 'Untitled Document' ? '' : noteService.getActiveNote()?.titulo"
        (input)="onTitleChange($event)" />
    </div>
  </div>

  <div class="right-section">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <span class="search-placeholder">Search...</span>
      <div class="shortcuts">
        <span class="shortcut-key">Ctrl</span>
        <span class="shortcut-key">K</span>
      </div>
    </div>

    <div class="actions-group">
      <button class="action-btn">
        <i class="fa-regular fa-moon"></i>
      </button>
      <button class="action-btn">
        <i class="fa-solid fa-headphones"></i>
      </button>
      <button class="action-btn">
        <i class="fa-regular fa-user"></i>
      </button>
    </div>
  </div>
</header>
