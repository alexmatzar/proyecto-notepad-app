<!-- Writing Area -->
<div class="flex-1 overflow-auto p-8 lg:p-12 relative" data-purpose="writing-canvas">
  <div class="text-gray-400 text-lg flex flex-col gap-6">
    <p>Start writing, press "/" for commands...</p>
    <button class="inline-flex items-center gap-2 bg-white border border-gray-200 shadow-sm rounded-full px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors w-fit group">
      <i class="fa-solid fa-wand-magic-sparkles text-[#0ea5e9] group-hover:text-blue-500 transition-colors"></i>
      Help me write
    </button>
  </div>
</div>

<!-- Bottom Actions -->
<div class="absolute bottom-4 right-4 flex items-center gap-2" data-purpose="bottom-right-actions">
  <button class="w-10 h-10 bg-white border border-gray-200 shadow-sm rounded flex items-center justify-center text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-all">
    <i class="fa-regular fa-copy"></i>
  </button>
  <button class="w-10 h-10 bg-white border border-gray-200 shadow-sm rounded flex items-center justify-center text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-all">
    <i class="fa-solid fa-download"></i>
  </button>
  <button class="w-10 h-10 bg-white border border-gray-200 shadow-sm rounded flex items-center justify-center text-gray-500 hover:bg-gray-50 hover:text-red-500 transition-all">
    <i class="fa-regular fa-trash-can"></i>
  </button>
</div>

<!-- Upload Doc -->
<div class="absolute bottom-4 left-4" data-purpose="bottom-left-actions">
  <button class="flex items-center gap-2 text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors">
    <i class="fa-solid fa-arrow-up-from-bracket"></i> Upload Doc
  </button>
</div>
