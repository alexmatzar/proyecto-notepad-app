<aside
  class="sidebar"
  [class.expanded]="estaPanelAbierto"
  (mouseenter)="alEntrarRaton()"
  (mouseleave)="alSalirRaton()">

  <div class="panel-content px-2">

    <button class="panel-new-btn" (click)="crearNuevaNota()" [title]="!estaPanelAbierto ? 'New Note' : ''">
      <i class="fa-solid fa-plus icon-fixed-width"></i>
      <span class="text-label">New Note</span>
    </button>

    <div class="section-header">
      <span class="panel-section-label">Notes</span>
      <button class="view-all text-label">View all</button>
    </div>

    @for (nota of noteService.notes(); track nota.id) {
      <div class="note-item-wrapper">
        <button class="panel-row" 
                [class.active-note]="noteService.IdnotaActiva() === nota.id"
                (click)="seleccionarNota(nota.id)"
                [title]="!estaPanelAbierto ? nota.titulo : ''">
          <i class="fa-regular fa-file-lines icon-fixed-width"></i>
          <span class="note-title-text text-label">{{ nota.titulo }}</span>
        </button>
        
        <button class="trash-hover-btn" (click)="abrirModalBorrado(nota, $event)" title="Move to trash">
          <i class="fa-regular fa-trash-can"></i>
        </button>
      </div>
    }

    <div class="panel-divider"></div>

    <span class="panel-section-label">Other Tools</span>

    <div class="flex flex-col gap-1">
      <button class="panel-row" title="AI Paraphraser">
        <i class="fa-solid fa-file-lines icon-fixed-width"></i>
        <span class="text-label">AI Paraphraser</span>
      </button>

      <button class="panel-row" title="Text to PDF">
        <i class="fa-solid fa-file-pdf icon-fixed-width"></i>
        <span class="text-label">Text to PDF</span>
      </button>

      <button class="panel-row" title="AI Summarizer">
        <i class="fa-solid fa-wand-magic-sparkles icon-fixed-width"></i>
        <span class="text-label">AI Summarizer</span>
      </button>
    </div>

    <div class="panel-divider"></div>

    <span class="panel-section-label">Other</span>

    <div class="flex flex-col gap-1">
      <button class="panel-row" title="Feedback">
        <i class="fa-regular fa-comment-dots icon-fixed-width"></i>
        <span class="text-label">Feedback</span>
      </button>

      <button class="panel-row" title="Trash">
        <i class="fa-regular fa-trash-can icon-fixed-width"></i>
        <span class="text-label">Trash</span>
      </button>

      <button class="panel-row" (click)="mostrarMas = !mostrarMas" title="More">
        <ion-icon name="chevron-down-circle-outline" [class.rotate]="mostrarMas" class="icon-fixed-width text-xl"></ion-icon>
        <span class="text-label">More</span>
      </button>

      @if (mostrarMas) {
        <div class="more-dropdown">
          <button class="panel-row sub-item"><ion-icon name="logo-apple" class="icon-fixed-width"></ion-icon><span class="text-label">Apple Store</span></button>
          <button class="panel-row sub-item"><ion-icon name="logo-google-playstore" class="icon-fixed-width"></ion-icon><span class="text-label">Play Store</span></button>
          <button class="panel-row sub-item"><ion-icon name="git-branch-outline" class="icon-fixed-width"></ion-icon><span class="text-label">Change Log</span></button>
          <button class="panel-row sub-item"><ion-icon name="shield-checkmark-outline" class="icon-fixed-width"></ion-icon><span class="text-label">Privacy Policy</span></button>
          <button class="panel-row sub-item"><ion-icon name="document-text-outline" class="icon-fixed-width"></ion-icon><span class="text-label">Terms of Use</span></button>
          <button class="panel-row sub-item"><ion-icon name="information-circle-outline" class="icon-fixed-width"></ion-icon><span class="text-label">About this Tool</span></button>
          <button class="panel-row sub-item"><ion-icon name="settings-outline" class="icon-fixed-width"></ion-icon><span class="text-label">Settings</span></button>
        </div>
      }
    </div>

  </div>
</aside>

@if (mostrarModalBorrado && notaABorrar) {
  <div class="modal-overlay">
    <div class="modal-box">
      <h3 class="modal-title">Move to trash?</h3>
      <p class="modal-desc">“{{ notaABorrar.titulo }}” will be moved to trash.</p>
      
      <div class="modal-actions">
        <button class="modal-btn cancel-btn" (click)="cancelarBorrado()">Cancel</button>
        <button class="modal-btn delete-confirm-btn" (click)="ejecutarBorrado()">Move to trash</button>
      </div>
    </div>
  </div>
}
